# Configuration for Firebase App Hosting (Google Cloud Run)
# Learn more: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: GROQ_API_KEY
    secret: GROQ_API_KEY
    availability:
      - RUNTIME
